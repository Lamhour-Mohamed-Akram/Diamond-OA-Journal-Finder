name: Mirror CNRST events feed

# The CNRST server sends no CORS headers, so the app can't fetch the feed
# directly from the browser. This workflow mirrors it into the repo daily;
# the app loads it from raw.githubusercontent.com instead.

on:
  schedule:
    - cron: '17 5 * * *'   # daily, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch feed
        shell: bash
        run: |
          FEED_URL='https://www.cnrst.ma/fr/liste-des-evenements/list?format=feed&type=rss'
          TMP_FILE='cnrst_new.xml'

          rm -f "$TMP_FILE" inter.der inter.pem cabundle.pem

          # cnrst.ma currently serves an incomplete TLS chain. Build a local CA
          # bundle with the missing HARICA/GEANT intermediate certificate.
          if ! curl -sSf --connect-timeout 20 --max-time 60 \
            'http://crt.harica.gr/HARICA-GEANT-TLS-R1.cer' -o inter.der; then
            echo '::warning::Could not download the CNRST TLS intermediate certificate. Keeping the existing cnrst.xml.'
            exit 0
          fi

          if ! openssl x509 -inform DER -in inter.der -out inter.pem 2>/dev/null; then
            echo '::warning::Could not convert the CNRST TLS intermediate certificate. Keeping the existing cnrst.xml.'
            exit 0
          fi

          cat /etc/ssl/certs/ca-certificates.crt inter.pem > cabundle.pem

          # CNRST is occasionally unavailable (503, timeout, SSL handshake error).
          # In that case, keep the last valid mirror instead of failing the Action.
          if ! curl -sSf --connect-timeout 20 --max-time 180 \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --cacert cabundle.pem "$FEED_URL" -o "$TMP_FILE"; then
            echo '::warning::CNRST feed is temporarily unavailable. Keeping the existing cnrst.xml.'
            rm -f "$TMP_FILE"
            exit 0
          fi

          # Never replace the cached feed with an invalid/empty response.
          if ! grep -q '<item>' "$TMP_FILE"; then
            echo '::warning::CNRST returned a response without RSS items. Keeping the existing cnrst.xml.'
            rm -f "$TMP_FILE"
            exit 0
          fi

          # lastBuildDate changes on every request; strip it so unchanged feeds
          # don't produce a new commit every day.
          sed -i 's|<lastBuildDate>[^<]*</lastBuildDate>||' "$TMP_FILE"
          mv "$TMP_FILE" cnrst.xml

      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add cnrst.xml
          git diff --cached --quiet || { git commit -m 'Update CNRST feed mirror'; git push; }
